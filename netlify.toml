[build]
  publish = "dist"
  command = "npm run build"
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "20"
  VITE_SHOULD_HIDE_PHONE_NUMBER = "true"

# SPA catch-all rewrite for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets with hash in filename
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
